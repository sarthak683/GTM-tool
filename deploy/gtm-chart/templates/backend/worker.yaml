apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-worker-deployment" .Release.Name }}
  namespace: {{ include "beacon.namespace" . }}
  labels:
    k8s-app: {{.Release.Name}}-{{ printf "worker" }}
    {{- include "beacon.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 420
  revisionHistoryLimit: 10
  replicas: 1
  selector:
    matchLabels:
      k8s-app: {{.Release.Name}}-{{ printf "worker" }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        k8s-app: {{.Release.Name}}-{{ printf "worker" }}
    spec:
      containers:
        - name: copilot
          image: "{{.Values.backend.image}}"
          command: [ "celery" ]
          # prefork, NOT --pool=solo (what this ran until 2026-08-15), for two
          # reasons measured in production:
          #
          # 1. task_time_limit / task_soft_time_limit in app/celery_app.py are
          #    enforced by killing the child process running the task. A
          #    single-process pool has no child to kill, so the documented
          #    "safety net" against a hung Gmail/Instantly/tl;dv HTTP call did
          #    not exist on the queue that makes all of those calls.
          # 2. solo runs exactly one task at a time.
          #    sync_active_instantly_campaigns takes ~175s every 15 min, and for
          #    that whole time nothing else on the default queue can run —
          #    including every per-user inbox sync, which is fanned out onto
          #    this same queue.
          #
          # concurrency 2 fits the 512Mi limit (each child is a full app
          # process); raise it with the memory limit, not on its own.
          args: [ "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--pool=prefork", "--concurrency=2" ]
          imagePullPolicy: "Always"
          envFrom:
            - secretRef:
                name: {{.Release.Name}}-backend-secret
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Priority-queue worker.
#
# This Deployment exists in the live gtm/gtm-prod releases but had gone missing
# from this chart copy, so `helm upgrade` would have PRUNED it — silently
# removing the only consumer of the "priority" queue (sourcing upload, ICP
# research, call transcription), leaving those tasks queued forever.
#
# Restored from the live release manifest (revision 163). Name, labels and
# selector match the running object exactly so Helm adopts it in place instead
# of recreating it — `spec.selector` is immutable, so they must not drift.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-priority-worker-deployment" .Release.Name }}
  namespace: {{ include "beacon.namespace" . }}
  labels:
    k8s-app: {{.Release.Name}}-{{ printf "priority-worker" }}
    {{- include "beacon.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 420
  revisionHistoryLimit: 10
  replicas: 1
  selector:
    matchLabels:
      k8s-app: {{.Release.Name}}-{{ printf "priority-worker" }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop to zero priority consumers mid-rollout.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        k8s-app: {{.Release.Name}}-{{ printf "priority-worker" }}
    spec:
      containers:
        - name: copilot
          image: "{{.Values.backend.image}}"
          command: [ "celery" ]
          # --queues=priority is what separates this from the default worker
          # above, which consumes the "celery" queue.
          #
          # prefork/concurrency=1, NOT --pool=solo, for the same reason as the
          # default worker: solo cannot enforce task_time_limit (no child to
          # kill), so one hung ICP-research HTTP call or Whisper upload wedged
          # the only priority consumer forever; after visibility_timeout the
          # broker redelivered the wedged message and side-effectful tasks
          # (sourcing upload -> paid enrichment) ran twice.
          args: [ "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--pool=prefork", "--concurrency=1", "--queues=priority" ]
          imagePullPolicy: "Always"
          envFrom:
            - secretRef:
                name: {{.Release.Name}}-backend-secret
          {{- with (default .Values.worker.resources (get .Values "priorityWorker" | default dict).resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
