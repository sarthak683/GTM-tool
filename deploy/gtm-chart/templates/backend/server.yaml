apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-backend-deployment" .Release.Name }}
  namespace: {{ include "beacon.namespace" . }}
  labels:
    k8s-app: {{.Release.Name}}-{{ printf "backend" }}
    {{- include "beacon.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 420
  revisionHistoryLimit: 10
  replicas: 2
  selector:
    matchLabels:
      k8s-app: {{.Release.Name}}-{{ printf "backend" }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        k8s-app: {{.Release.Name}}-{{ printf "backend" }}
    spec:
      initContainers:
        - name: run-migrations
          image: "{{.Values.backend.image}}"
          command: [ "alembic", "upgrade", "head" ]
          envFrom:
            - secretRef:
                name: {{.Release.Name}}-backend-secret
      containers:
        - name: copilot
          image: "{{.Values.backend.image}}"
          imagePullPolicy: "Always"
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          envFrom:
            - secretRef:
                name: {{.Release.Name}}-backend-secret
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}-backend
  namespace: {{ include "beacon.namespace" . }}
  labels:
    k8s-svc: {{.Release.Name}}-{{ printf "backend" }}
    {{- include "beacon.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.backend.service.annotations}}
    {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    k8s-app: {{.Release.Name}}-{{ printf "backend" }}
