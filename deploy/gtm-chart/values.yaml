global:
  certs:
    email: dk@beacon.li
postgresql:
  enabled: true
  architecture: standalone
  image:
    repository: bitnamilegacy/postgresql
    # Pin THE DATABASE to the exact digest production runs today (PG 17.5).
    # bitnamilegacy is a frozen archive whose :latest floated across major
    # versions; if a future pod reschedule pulled a PG 18 "latest", postgres
    # would refuse to start on the PG17 data directory — a hard outage until
    # someone hand-pins the old image. Digest = imageID of gtm-postgresql-0
    # on 2026-08-15 (subchart: digest overrides tag). Upgrading majors is a
    # deliberate migration, not an accidental image pull.
    digest: "sha256:42a8200d35971f931b869ef5252d996e137c6beb4b8f1b6d2181dc7d1b6f62e0"
  auth:
    username: beacon
    password: "REPLACE_AT_DEPLOY"
    rootPassword: "REPLACE_AT_DEPLOY"
    database: "beacon"
  primary:
    persistence:
      enabled: true
      size: 20Gi
    # Was inheriting the subchart default of 192Mi / 150m, which OOMKilled the
    # production database on 2026-08-15 at ~109Mi steady state — under two-fold
    # headroom for a database whose usage spikes on concurrent queries, sorts
    # and autovacuum. An OOM kill drops every in-flight connection at once,
    # which surfaces to reps as unexplained intermittent failures.
    # 1Gi gives ~9x headroom over observed steady state; the node pool runs at
    # ~35% memory with ~29Gi allocatable per node, so this costs nothing.
    # ephemeral-storage is carried over from the subchart preset an explicit
    # `resources` block replaces wholesale. Postgres spills large sorts to temp
    # files on the node's disk (the 20Gi PVC holds data, not temp), so dropping
    # the cap would let a runaway query fill the node.
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 50Mi

redis:
  image:
    repository: bitnamilegacy/redis
  architecture: standalone
  auth:
    enabled: false
  commonConfiguration: |-
    # maxmemory MUST stay below the container limit below. It previously said
    # 896mb against a 192Mi container, so Redis believed it had ~4.6x the memory
    # it could actually use — instead of evicting it would be OOMKilled, losing
    # the Celery broker and every queued task with it.
    maxmemory 384mb
    # noeviction, NOT allkeys-lru. This Redis is the Celery broker: its keys are
    # queued task messages, not a cache. Under allkeys-lru (what it ran until
    # 2026-08-15) Redis answers memory pressure by *deleting queued tasks* —
    # silently, with no error to the producer, no entry in any log, and no
    # failure recorded against the task that never ran. A sourcing upload, an
    # ICP research job or a call transcription simply never happens.
    #
    # That is the single best explanation available for "the CRM works
    # sometimes but not consistently": the failure mode is invisible by
    # construction. With noeviction the producer gets an OOM error it can retry
    # and surface, which is the difference between a bug and a mystery.
    maxmemory-policy noeviction
    notify-keyspace-events Egxe
  master:
    # NOT ENABLED, deliberately, and it is a real remaining gap: with no volume
    # a Redis restart (OOM kill, node drain, Helm upgrade) drops every queued
    # task on the floor. Celery task_acks_late (see app/celery_app.py) recovers
    # tasks a *worker* loses, but nothing recovers tasks the *broker* loses.
    #
    # Turning this on is not a values-only edit: persistence.enabled adds a
    # volumeClaimTemplate, and Kubernetes rejects changes to a StatefulSet's
    # volumeClaimTemplates, so `helm upgrade` fails until the StatefulSet is
    # deleted (`--cascade=orphan`) and recreated. That is a planned maintenance
    # window on the broker, not something to bundle into an app deploy.
    persistence:
      enabled: false
    # ephemeral-storage preserved from the subchart preset — see the note on
    # postgresql above; an explicit resources block replaces it wholesale.
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 2Gi
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 50Mi

backend:
  image: "beacon.azurecr.io/gtm-be:v0.9"
  domain: ""
  env: { }
  # Observed 307Mi against a 512Mi limit while serving a ~4.9k-row CSV export —
  # 1.7x headroom, close enough that a couple of concurrent exports or a large
  # report could OOM the API. 1Gi restores ~3x headroom over that peak.
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 384Mi
  nodeSelector: { }
  service:
    annotations: { }

frontend:
  image: "beacon.azurecr.io/gtm-fe:v0.9"
  env: { }
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  nodeSelector: { }
  service:
    annotations: { }

beat:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  nodeSelector: { }

worker:
  # Sized for the prefork pool (see templates/backend/worker.yaml): a parent
  # plus --concurrency=2 children, each a full app process. Observed 110Mi as a
  # single solo process, so ~330Mi is the realistic floor before any task loads
  # data — instantly_sync pulls lead batches on top of that. 512Mi would have
  # OOMKilled the pool, and an OOMKilled worker loses whatever it was running.
  # The node pool sits at ~35% memory with ~29Gi allocatable, so 1Gi is free.
  # CPU raised in step: two I/O-bound children sharing 500m would throttle.
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 384Mi
  nodeSelector: { }
