# Tooling configuration for the Beacon GTM CRM backend.
#
# Scope is intentionally narrow: this file configures pytest and ruff only.
# It does NOT declare the project as a build target / installable package —
# the app runs from source inside Docker (see Dockerfile / requirements.txt),
# so there is no [build-system] or [project] table on purpose. Adding one would
# make tools try to build/install the repo, which is not how it is deployed.

[tool.pytest.ini_options]
# `auto` lets us write `async def test_...` without decorating every coroutine
# test with `@pytest.mark.asyncio`. Provided by pytest-asyncio (pinned in
# requirements.txt). The current suite is sync, but the app is async-first and
# new integration tests will be coroutines, so default to auto.
asyncio_mode = "auto"
# Only collect from tests/. Stops pytest from wandering into app/, scripts/, or
# alembic/ and importing modules with heavy import-time side effects.
testpaths = ["tests"]
# Put the repo root on sys.path so `from app...` imports resolve. Without this
# every test file fails at COLLECTION with "No module named 'app'" — which is
# what CI had been doing on main: 202 passing tests reported as 24 errors, so
# the suite gated nothing. It works locally only because the Docker image
# installs the app onto the interpreter path.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
# Lint the backend source + tests; never the generated/vendored trees. Alembic
# migrations are auto-generated and frequently break style rules; the frontend
# is TypeScript; virtualenvs and caches are not ours to lint.
extend-exclude = [
    "alembic",
    "frontend",
    "storage",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Every rule here is currently at ZERO across app/, so the gate is green today
# and its only job is to stop regressions. Each was chosen by measuring this
# codebase, not copied from a template.
#
#   E9     - syntax errors (IndentationError, SyntaxError, ...)
#   F63    - invalid comparisons (e.g. assert on a tuple literal)
#   F7     - statement-level mistakes (break/continue/return outside a loop)
#   F82    - undefined name (typos, missing imports referenced at runtime)
#   F811   - redefinition of an unused name. This is the rule that would have
#            caught `drive` being imported twice in api/v1/router.py, which
#            registered all 7 /drive routes a second time, and the sqlalchemy
#            `text` import in repositories/deal.py that was shadowed by a local
#            string variable in three helpers.
#   F632   - `is` against a literal. Always a bug; silently False.
#   E711   - `== None` instead of `is None`.
#   E713/4 - `not x in y` / `not x is y`.
#   B023   - a closure capturing a loop variable. clients/brand_scraper.py had
#            one that worked only because the callback happened to be invoked
#            synchronously.
select = ["E9", "F63", "F7", "F82", "F811", "F632", "E711", "E713", "E714", "B023"]

# Deliberately NOT selected, with reasons — do not "tidy" these in later:
#   B008 (49 hits) - flags FastAPI's `Depends()` / `Query()` / `File()` in
#          argument defaults. That IS the framework's idiom here; the rule is
#          right about plain Python and wrong about FastAPI.
#   E712 (4 hits)  - suggests rewriting `Column == False` as `not Column`. On a
#          SQLAlchemy column that invokes __bool__ instead of building a SQL
#          expression, so the "fix" breaks the query. See
#          services/account_sourcing.py `Contact.email_verified == False`.
#   F401 (89), F841 (17), B904 (49), PIE794 (21) - real but numerous; they need
#          a cleanup pass before they can gate, and gating them while red would
#          just train everyone to ignore the output again.
ignore = []
