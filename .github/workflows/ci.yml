name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only — no registry credentials in CI, and no push. This exists so
      # an image that cannot build fails the PR instead of failing at deploy
      # time on someone's laptop.
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: false
          build-args: VITE_API_URL=

  charts:
    name: Helm charts (lint + regression guards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint
        run: |
          helm lint deploy/gtm-chart --set backend.image=x --set frontend.image=y
          helm lint helm/beacon-crm

      # Each check below corresponds to a bug that actually reached production
      # on 2026-08-15. They render the chart and assert on the output, so a
      # regression fails the PR rather than the cluster.
      - name: Regression guards
        run: |
          set -euo pipefail

          echo "::group::gtm chart renders all five app workloads"
          helm template gtm deploy/gtm-chart -n gtm-prod \
            --set backend.image=x --set frontend.image=y > /tmp/gtm.yaml
          for w in gtm-backend-deployment gtm-worker-deployment gtm-beat-deployment \
                   gtm-priority-worker-deployment gtm-frontend-deployment; do
            grep -q "name: $w" /tmp/gtm.yaml || {
              echo "MISSING workload: $w"
              echo "A helm upgrade would PRUNE this from the live release."
              exit 1
            }
            echo "ok: $w"
          done
          echo "::endgroup::"

          echo "::group::frontend serves 8080, never 80"
          # Every gtm-fe image runs nginx-unprivileged, which cannot bind port
          # 80. A chart that says 80 points the Service at a dead port and
          # returns 503s (this took gtm.beacon.li down).
          if grep -E "containerPort: 80$|targetPort: 80$" /tmp/gtm.yaml; then
            echo "Found port 80 in the gtm chart — frontend must use 8080."
            exit 1
          fi
          grep -q "targetPort: 8080" /tmp/gtm.yaml || { echo "no targetPort 8080 found"; exit 1; }
          echo "ok: frontend on 8080"
          echo "::endgroup::"

          echo "::group::vendored chart carries no credentials"
          if grep -rnE "rootPassword: *[\"']?[0-9a-f]{16,}" deploy/gtm-chart/values.yaml; then
            echo "A real credential is committed in deploy/gtm-chart/values.yaml."
            exit 1
          fi
          echo "ok: placeholders only"
          echo "::endgroup::"

          echo "::group::beacon-crm chart overrides every image"
          # The chart defaults every workload to beacon-crm/backend:latest,
          # which does not exist in ACR. Staging lost three pods to this.
          helm template gtm helm/beacon-crm -n gtm \
            -f helm/beacon-crm/values-staging.yaml \
            --set-string backend.image.repository=r --set-string backend.image.tag=t \
            --set-string frontend.image.repository=r --set-string frontend.image.tag=t \
            --set-string worker.image.repository=r --set-string worker.image.tag=t \
            --set-string priorityWorker.image.repository=r --set-string priorityWorker.image.tag=t \
            --set-string beat.image.repository=r --set-string beat.image.tag=t > /tmp/bc.yaml
          if grep -q "beacon-crm/backend:latest" /tmp/bc.yaml; then
            echo "A workload still falls back to beacon-crm/backend:latest."
            exit 1
          fi
          echo "ok: no latest fallbacks"
          echo "::endgroup::"

          echo "::group::staging is never ENVIRONMENT=production"
          # ENVIRONMENT=production on staging trips validate_runtime_secrets()
          # AND sends scheduled sales reports to the real recipient list.
          grep -q "ENVIRONMENT: development" helm/beacon-crm/values-staging.yaml || {
            echo "values-staging.yaml must pin ENVIRONMENT=development"
            exit 1
          }
          echo "ok: staging pinned to development"
          echo "::endgroup::"
