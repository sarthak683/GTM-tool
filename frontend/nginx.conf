server {
  # Port 8080, not 80: the runtime image is nginxinc/nginx-unprivileged, which
  # runs as a non-root user that cannot bind privileged ports (<1024). The Helm
  # frontend container port, Service targetPort, and probes must all use 8080.
  listen 8080;
  server_name _;

  client_max_body_size 50M;

  # Compress text assets — JS/CSS bundles shrink dramatically over the wire.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;



  # Hashed asset files — safe to cache forever because filename changes on every build.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached so new JS bundles are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # The Data Room "Sales Lifecycle" tab iframes this exact URL. It is a static
  # document that must ship in the image via frontend/public/data-room/.
  #
  # Exact-match (`location = ...`) on purpose: the SPA route is /data-room, and
  # a prefix match would break client-side navigation to it. This only governs
  # the one document URL.
  #
  # `=404` instead of the SPA fallback below: when the document is missing, the
  # generic fallback answers HTTP 200 with the CRM's own index.html, so the
  # iframe silently renders the entire app inside itself and the tab looks like
  # it is showing stale content. Failing loudly makes a missing document
  # obvious instead of masking it.
  location = /data-room/index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # /data-room is BOTH a React route and, since the SOP document shipped, a real
  # directory on disk. Those two facts collide in the fallback below: its
  # `$uri/` term matches the directory, so nginx 301s /data-room -> /data-room/
  # and serves that directory's index.html — the SOP document, raw, with no app
  # shell, no nav and no way back. The Data Room tab's item grid, add form and
  # preview modal all become unreachable, while the page still *looks* like it
  # loaded something, which is why this is easy to ship without noticing.
  #
  # Two exact matches, because the redirect means both spellings get requested.
  # `location =` is resolved before any prefix match, so these win over `/`
  # without disturbing the document rule above.
  location = /data-room {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }
  location = /data-room/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }

  # SPA fallback — serves index.html for all frontend routes so
  # client-side routing (React Router) works on refresh/direct navigation.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
